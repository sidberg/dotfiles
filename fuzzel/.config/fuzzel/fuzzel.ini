# Tokyo Night (ported from ~/.config/wofi/style.css)
[main]
font=Inter:size=11
prompt="Search "
width=45
lines=12
horizontal-pad=16
vertical-pad=12
inner-pad=8
icon-theme=hicolor
icons-enabled=yes
terminal=alacritty -e

[colors]
background=1a1b26f7
text=c0caf5ff
prompt=7aa2f7ff
input=c0caf5ff
match=7aa2f7ff
selection=283457ff
selection-text=7aa2f7ff
selection-match=bb9af7ff
border=7aa2f7ff

[border]
width=2
radius=10
